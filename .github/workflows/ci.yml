name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install ruff pytest

      - name: AST parse
        run: |
          python -c "import ast; ast.parse(open('app/main.py', encoding='utf-8').read()); print('main.py syntax OK')"
          python -c "import ast; ast.parse(open('app/hexconv.py', encoding='utf-8').read()); print('hexconv.py syntax OK')"

      - name: Ruff lint (tylko realne bugi)
        run: ruff check app/ tests/ --select=E9,F --ignore=F401,F541,F841

      - name: Self-test logiki (bez SDL)
        run: python app/hexconv.py

      - name: Pytest (testy jednostkowe konwersji)
        run: pytest -q tests/

      - name: Walidacja struktury GUI (mock — bez uruchamiania SDL)
        run: |
          python -c "
          src = open('app/main.py', encoding='utf-8').read()
          assert 'class HexApp' in src, 'klasa HexApp wymagana'
          assert 'def render' in src and 'def run' in src, 'metody render/run wymagane'
          assert 'fb0/blank' in src, 'POWER toggle przez fb0/blank wymagany'
          assert 'MENU_KEYS' in src, 'MENU exit wymagany'
          assert 'from hexconv import' in src, 'logika ma byc importowana z hexconv (testowalnosc)'
          print('struct OK')
          "

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error app/AnberHex.sh scripts/install.sh
